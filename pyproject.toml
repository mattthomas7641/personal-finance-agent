[project]
name = "northstar-finance"
version = "0.1.0"
description = "Northstar (Personal Finance Agent): answers questions about your money with numbers it can prove."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.13", "plaid-python>=45", "fastapi", "uvicorn[standard]", "sqlmodel", "jinja2", "pyyaml", "python-multipart", "httpx", "keyring"]

[project.optional-dependencies]
dev = ["pytest", "playwright"]
# Exact tested versions live in requirements.lock (pip install -r requirements.lock); Dependabot keeps it current.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
