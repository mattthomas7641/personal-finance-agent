{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Signed out · Northstar{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-[12vh]">
  <div class="panel"><div class="panel-b text-center space-y-2">
    <h1 class="text-[16px] font-semibold">Signed out</h1>
    <p class="hint">Saved offline copies on this device were deleted.</p>
    <a href="/login" class="btn btn-primary mt-2">Sign in again</a>
  </div></div>
</div>
<script>
  caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
  navigator.serviceWorker?.controller?.postMessage("clear");
</script>
{% endblock %}
