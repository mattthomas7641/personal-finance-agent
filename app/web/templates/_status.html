<div class="alert {{ 't-info' if status.busy else 't-muted bg-white border-[var(--line)]' }}"
     {% if status.busy %}hx-get="/status" hx-trigger="every 1.5s" hx-swap="outerHTML"{% endif %}>
  {% if status.busy %}<span class="inline-block w-2 h-2 mt-1.5 rounded-full bg-[var(--info)] animate-pulse"></span>{% endif %}<div>{{ status.message }}</div>
</div>
