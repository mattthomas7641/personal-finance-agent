{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}Sign in · Northstar{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-[12vh]">
  <div class="flex items-center gap-2.5 justify-center mb-6"><img src="/static/icon-180.png" class="w-9 h-9 rounded-lg" alt=""><span class="text-[18px] font-semibold">Northstar</span></div>
  <form method="post" action="/login" class="panel">
    <div class="panel-b space-y-3">
      <div><h1 class="text-[16px] font-semibold">Sign in</h1><p class="hint">Enter the passcode you set on your Mac.</p></div>
      {% if error %}<div class="alert t-bad">{{ error }}</div>{% endif %}
      <input type="hidden" name="next" value="{{ next }}">
      <label class="lbl">Passcode<input type="password" name="passcode" required autofocus autocomplete="current-password" class="field"></label>
      <button class="btn btn-primary w-full">Unlock</button>
    </div>
  </form>
</div>
{% endblock %}
