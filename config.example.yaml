# Copy to config.yaml to customize.
models:
  categorize: claude-sonnet-5     # bulk, cheap
  agent: claude-opus-5-5          # answers questions
agent:
  max_turns: 16
  max_cost_usd: 0.50
budgets:            # monthly, by category
  Dining: 400
  Groceries: 600
  Shopping: 300
  Entertainment: 100
privacy:
  # standard: transaction descriptors are redacted, then sent to Claude for categorization.
  # local_only: nothing is sent for categorization (rules, built-ins and Plaid categories only);
  #             Claude is used only when you ask a question.
  mode: standard
  # Always replaced with [redacted] before anything is sent: your name, street, employer, etc.
  redact_terms: []
