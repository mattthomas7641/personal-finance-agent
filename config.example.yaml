# Copy to config.yaml to customize.
models:
  categorize: claude-sonnet-5     # bulk, cheap
  agent: claude-haiku-5-5         # answers questions; 22/22 on the eval at ~$0.0006-0.006 per question
  agent_escalate: claude-opus-5-5 # takes over if the number checker rejects an answer ("" to disable)
agent:
  max_turns: 16
  max_cost_usd: 0.50     # per question
  daily_cost_usd: 2.00   # all questions in a day
  weekly_digest: true    # write a number-checked summary every 7 days (false to turn off)
budgets:            # monthly, by category
  Dining: 400
  Groceries: 600
  Shopping: 300
  Entertainment: 100
privacy:
  # standard: transaction descriptors are redacted, then sent to Claude for categorization.
  # local_only: nothing is sent for categorization (rules, built-ins and Plaid categories only);
  #             Claude is used only when you ask a question.
  mode: standard
  # Always replaced with [redacted] before anything is sent: your name, street, employer, etc.
  redact_terms: []
