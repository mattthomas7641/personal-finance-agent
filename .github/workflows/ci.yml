name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 * * 1"   # weekly, so new CVEs in pinned dependencies show up even without a push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock && pip install -e . --no-deps
      - name: Tests (no network, no API keys; the offline test needs Chromium and runs locally)
        run: pytest -q --ignore=tests/test_offline.py
      - name: Number checker eval (free, deterministic)
        run: python -m evals.run checker

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Known vulnerabilities in pinned dependencies
        run: pip-audit -r requirements.lock
      - name: Static analysis (medium and high severity)
        run: bandit -q -r app -ll

  leaks:
    # Secrets anywhere in history (gitleaks) and personal-data/file-type rules on the current tree (leak guard).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Leak guard (personal data, exports, saved pages, screenshots)
        run: python3 scripts/leak_guard.py --all

